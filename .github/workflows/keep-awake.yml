.github/workflows/keep-awake.yml
name: Keep Supabase Awake

# WHAT TRIGGERS THE ROBOT: Run every 4 days automatically, or manually if we click a button
on:
  schedule:
    - cron: '0 0 */4 * *' # Runs at midnight every 4 days
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab to test it

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase URL
        run: |
          curl -I "https://zxpobxfcrhfkgipnqgad.supabase.co"
